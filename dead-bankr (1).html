<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Dead Bankr</title>
<style>
  :root{
    --bg-deep:#140b29;
    --bg-glow:#4b2fae;
    --purple:#6b4bd6;
    --static-light:#cfd0d6;
    --amber:#e8d9a0;
    --rust:#8a5a3a;
    --text-glitch:#f4efe0;
  }

  @font-face {
    font-family: 'sys-mono';
    src: local('Courier New');
  }

  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(ellipse at 50% 40%, var(--bg-glow) 0%, var(--bg-deep) 70%);
    overflow-x:hidden;
    font-family: 'Courier New', monospace;
  }

  .stage{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2.2rem;
    padding:3rem 1rem;
    position:relative;
  }

  /* ambient scanlines over whole page */
  .stage::before{
    content:"";
    position:fixed; inset:0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.18) 0px,
      rgba(0,0,0,0.18) 1px,
      transparent 2px,
      transparent 4px
    );
    pointer-events:none;
    mix-blend-mode:multiply;
    z-index:5;
  }

  .tv-wrap{
    position:relative;
    width:min(70vw, 480px);
  }

  .tv-img{
    width:100%;
    display:block;
    image-rendering: pixelated;
    filter: drop-shadow(0 0 40px rgba(107,75,214,0.55));
    animation:
      tv-flicker 3.4s infinite steps(1),
      tv-error-shake 3.4s infinite;
  }

  /* the erroring / dying TV flicker */
  @keyframes tv-flicker{
    0%   { opacity:1;    filter: drop-shadow(0 0 40px rgba(107,75,214,0.55)) brightness(1); }
    2%   { opacity:0.2;  filter: brightness(2.4) saturate(0.2); }
    4%   { opacity:1;    filter: brightness(0.7); }
    6%   { opacity:0.15; filter: brightness(3) hue-rotate(20deg); }
    8%   { opacity:1;    filter: brightness(1); }
    40%  { opacity:1;    filter: brightness(1); }
    42%  { opacity:0.25; filter: brightness(2) contrast(1.6); }
    44%  { opacity:1;    filter: brightness(0.8); }
    46%  { opacity:1;    filter: brightness(1); }
    70%  { opacity:1; }
    71%  { opacity:0.1;  filter: brightness(2.6); }
    73%  { opacity:1;    filter: brightness(1); }
    100% { opacity:1;    filter: brightness(1); }
  }

  @keyframes tv-error-shake{
    0%, 96%, 100% { transform: translate(0,0); }
    97% { transform: translate(-3px, 1px); }
    98% { transform: translate(3px, -1px); }
    99% { transform: translate(-2px, 0); }
  }

    opacity:0;
    animation: rgb-split 3.4s infinite;
    pointer-events:none;
  }

  @keyframes rgb-split{
    0%, 95%, 100% { opacity:0; transform:translate(0,0); filter:none; }
    96% { opacity:0.5; transform:translate(4px,0); filter:hue-rotate(90deg); }
    97% { opacity:0.4; transform:translate(-4px,1px); filter:hue-rotate(200deg); }
    98% { opacity:0; }
  }

  .title-track{
    width: min(90vw, 560px);
    overflow:hidden;
    border-top:1px dashed rgba(232,217,160,0.35);
    border-bottom:1px dashed rgba(232,217,160,0.35);
    padding:0.6rem 0;
    background: rgba(0,0,0,0.25);
    position:relative;
    z-index:6;
  }

  .title-track .marquee{
    display:inline-block;
    white-space:nowrap;
    animation: scroll-left 7s linear infinite;
    will-change: transform;
  }

  .title-track .marquee span{
    display:inline-block;
    font-size: clamp(1.8rem, 6vw, 3.2rem);
    font-weight:700;
    letter-spacing:0.12em;
    color: var(--amber);
    text-shadow:
      2px 0 rgba(255,0,90,0.55),
      -2px 0 rgba(0,220,255,0.45),
      0 0 18px rgba(232,217,160,0.35);
    padding: 0 3rem;
    animation: glitch-text 2.6s infinite steps(2, end);
  }

  @keyframes scroll-left{
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  @keyframes glitch-text{
    0%, 88%, 100% {
      transform: translate(0,0);
      text-shadow:
        2px 0 rgba(255,0,90,0.55),
        -2px 0 rgba(0,220,255,0.45),
        0 0 18px rgba(232,217,160,0.35);
      clip-path: none;
    }
    89% {
      transform: translate(-3px,1px) skewX(-4deg);
      text-shadow:
        6px 0 rgba(255,0,90,0.8),
        -6px 0 rgba(0,220,255,0.7);
    }
    90% {
      transform: translate(3px,-1px);
      clip-path: inset(20% 0 30% 0);
    }
    91% {
      transform: translate(0,0);
      clip-path: none;
    }
  }

  .subtitle{
    color: rgba(207,208,214,0.6);
    font-size:0.85rem;
    letter-spacing:0.35em;
    text-transform:uppercase;
    z-index:6;
  }

  .subtitle::before{ content:"[ "; }
  .subtitle::after{ content:" ]"; }

  @media (prefers-reduced-motion: reduce){
    .tv-img, .tv-wrap::after, .title-track .marquee, .title-track .marquee span{
      animation: none !important;
    }
  }

  /* ---- Contract / links / live chat section ---- */
  .info-panel{
    width: min(90vw, 560px);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0.9rem;
    z-index:6;
  }

  .contract-box{
    width:100%;
    display:flex;
    align-items:center;
    gap:0.6rem;
    background: rgba(0,0,0,0.35);
    border:1px dashed rgba(232,217,160,0.4);
    border-radius:10px;
    padding:0.7rem 0.9rem;
  }

  .contract-label{
    font-size:0.65rem;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color: var(--amber);
    white-space:nowrap;
  }

  .contract-address{
    flex:1;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:0.85rem;
    color: var(--static-light);
    letter-spacing:0.02em;
  }

  .copy-btn{
    flex-shrink:0;
    background: rgba(107,75,214,0.35);
    border:1px solid rgba(232,217,160,0.4);
    color: var(--text-glitch);
    font-family:'Courier New', monospace;
    font-size:0.7rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding:0.4rem 0.7rem;
    border-radius:6px;
    cursor:pointer;
    transition: background 0.2s ease, transform 0.1s ease;
  }

  .copy-btn:hover{ background: rgba(107,75,214,0.6); }
  .copy-btn:active{ transform: scale(0.96); }

  .action-row{
    width:100%;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:0.8rem;
  }

  .action-btn{
    display:inline-flex;
    align-items:center;
    gap:0.5rem;
    text-decoration:none;
    font-family:'Courier New', monospace;
    font-size:0.75rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color: var(--text-glitch);
    background: rgba(0,0,0,0.35);
    border:1px solid rgba(232,217,160,0.4);
    padding:0.65rem 1.1rem;
    border-radius:8px;
    transition: background 0.2s ease, box-shadow 0.2s ease, transform 0.1s ease;
  }

  .action-btn:hover{
    background: rgba(107,75,214,0.45);
    box-shadow: 0 0 16px rgba(107,75,214,0.5);
    transform: translateY(-2px);
  }

  .action-btn:active{ transform: translateY(0); }

  .action-btn.chat{
    border-color: rgba(255,0,90,0.55);
  }

  .action-btn.chat:hover{
    background: rgba(255,0,90,0.35);
    box-shadow: 0 0 16px rgba(255,0,90,0.55);
  }

  .action-btn .dot{
    width:8px; height:8px;
    border-radius:50%;
    background: var(--amber);
    box-shadow: 0 0 8px var(--amber);
    animation: dot-pulse 1.6s infinite ease-in-out;
  }

  @keyframes dot-pulse{
    0%, 100% { opacity:1; transform:scale(1); }
    50% { opacity:0.4; transform:scale(0.7); }
  }
</style>

  <script>
    function copyContract(){
      const el = document.getElementById('contractAddress');
      const btn = document.getElementById('copyBtn');
      navigator.clipboard.writeText(el.textContent.trim()).then(() => {
        const original = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = original; }, 1500);
      }).catch(() => {
        const original = btn.textContent;
        btn.textContent = 'Failed';
        setTimeout(() => { btn.textContent = original; }, 1500);
      });
    }
